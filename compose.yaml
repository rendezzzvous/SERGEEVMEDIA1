name: sergeev-landing

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: '${NEXT_PUBLIC_SITE_URL:-https://sergeev.media}'
        NEXT_PUBLIC_CDN_BASE: '${NEXT_PUBLIC_CDN_BASE:-https://pub-be8d4a5abc704b2191aa35c87855b98e.r2.dev}'
      # Build-time секрет для RUN --mount=type=secret,id=npmrc (раскомментировать + блок внизу)
      # secrets: [npmrc]
    image: sergeev-landing:latest
    restart: unless-stopped
    # Без ports: — Traefik панели (Coolify/Dokploy) ходит в контейнер по внутренней сети.
    # Для локальной проверки: docker compose -f compose.yaml -f compose.local.yaml up
    expose: ['3000']
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
    secrets: [telegram_bot_token, telegram_chat_id]
    # Dokploy: раскомментировать сеть и блок networks внизу
    # networks: [dokploy-network]

secrets:
  # file-secret = bind mount в /run/secrets/<name>; uid/gid/mode игнорируются → chmod 0444 secrets/*
  telegram_bot_token:
    file: ./secrets/telegram_bot_token # Dokploy File Mount: ../files/telegram_bot_token
  telegram_chat_id:
    file: ./secrets/telegram_chat_id # Dokploy File Mount: ../files/telegram_chat_id
  # npmrc:
  #   file: ${HOME}/.npmrc

# networks:
#   dokploy-network:
#     external: true
